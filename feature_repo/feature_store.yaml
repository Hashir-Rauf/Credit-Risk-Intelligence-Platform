# Feast repo config for the `feast` CLI (feast apply / feast ui / feast materialize-incremental).
# The pipeline itself builds an equivalent RepoConfig in Python (src/features/feast_features.py
# repo_config) so that smoke runs and tests can use other directories; a test keeps the two in sync.
project: credit_risk
provider: local
registry: ../data/feast/registry.db
online_store:
  type: sqlite
  path: ../data/feast/online_store.db
offline_store:
  type: dask
entity_key_serialization_version: 3
