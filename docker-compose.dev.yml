# Development overrides: publish every service on localhost so you can poke at them.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    environment:
      LOG_LEVEL: DEBUG
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  mlflow:
    ports:
      - "127.0.0.1:5000:5000"
  prometheus:
    ports:
      - "127.0.0.1:9090:9090"
