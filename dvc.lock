          batch_size: 1000
          reference_path: data/reference/reference.parquet
          batches_dir: data/simulated
          report_path: reports/drift_scenarios.json
          psi_bins: 10
          psi_threshold: 0.2
          drift_share_alert: 0.3
          scenarios:
          - name: no_drift
            description: Control batch drawn from the same distribution; must 
              NOT alert.
            expect_alert: false
            changes: []
          - name: limit_bal_inflation
            description: Credit limits inflated by 60 percent (e.g. a new, 
              wealthier customer segment).
            expect_alert: false
            changes:
            - columns:
              - LIMIT_BAL
              op: multiply
              value: 1.6
          - name: payment_delays
            description: Payment status slips by two months and actual payments 
              halve (economic shock).
            expect_alert: true
            changes:
            - columns:
              - PAY_1
              - PAY_2
              - PAY_3
              - PAY_4
              - PAY_5
              - PAY_6
              op: add
              value: 2
            - columns:
              - PAY_AMT1
              - PAY_AMT2
              - PAY_AMT3
              - PAY_AMT4
              - PAY_AMT5
              - PAY_AMT6
              op: multiply
              value: 0.5
          - name: spending_surge
            description: Bills and payments grow 2.5x while credit limits are 
              halved (inflation plus tightening).
            expect_alert: true
            changes:
            - columns:
              - BILL_AMT1
              - BILL_AMT2
              - BILL_AMT3
              - BILL_AMT4
              - BILL_AMT5
              - BILL_AMT6
              op: multiply
              value: 2.5
            - columns:
              - PAY_AMT1
              - PAY_AMT2
              - PAY_AMT3
              - PAY_AMT4
              - PAY_AMT5
              - PAY_AMT6
              op: multiply
              value: 2.5
            - columns:
              - LIMIT_BAL
              op: multiply
              value: 0.5
        validation.domains:
          SEX:
          - 1
          - 2
          EDUCATION:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          MARRIAGE:
          - 0
          - 1
          - 2
          - 3
        validation.ranges:
          LIMIT_BAL:
          - 1
          - 5000000
          AGE:
          - 18
          - 100
          PAY:
          - -2
          - 9
          BILL_AMT:
          - -1000000
          - 5000000
          PAY_AMT:
          - 0
          - 10000000
