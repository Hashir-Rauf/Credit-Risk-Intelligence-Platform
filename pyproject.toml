[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks", "docs/evidence"]  # exploration scripts and captured evidence; not product code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Long docstrings and SQL strings in the monitoring modules; black already wraps the code itself.
"src/monitoring/drift.py" = ["E501"]
"src/monitoring/prediction_log.py" = ["E501"]
"scripts/simulate_drift.py" = ["E501", "S310"]
"monitoring/alert_sink.py" = ["E501"]
"pipelines/retrain/*.py" = ["E501"]
"pipelines/airflow/dags/retrain_dag.py" = ["E501"]
"pipelines/tests/test_retrain*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "integration: needs multiple components working together",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "frontend/node_modules"]
