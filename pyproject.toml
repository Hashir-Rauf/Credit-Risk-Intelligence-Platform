# Tool configuration only (this project is not packaged for PyPI).

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: slower tests that run real subprocesses (git, dvc)",
]

[tool.coverage.run]
source = ["src"]
