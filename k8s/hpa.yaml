# Optional. Needs metrics-server (`minikube addons enable metrics-server -p <profile>`).
# Scales between 2 and 4 replicas on CPU. Do not apply it while demonstrating `kubectl scale` by hand: the
# autoscaler would immediately override the replica count.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: credit-risk
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: credit-risk
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60 # of the 200m request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
