# Local stack: scoring API + frontend + MLflow (Postgres) + Prometheus + Grafana.
#
#   cp .env.example .env        # then set API_KEY, POSTGRES_PASSWORD, GRAFANA_ADMIN_PASSWORD
#   dvc pull -r dagshub         # puts models/model.joblib and models/explainer_background.parquet in place
#   docker compose up --build
#
# Base file publishes only the API (8000) and frontend (3000), bound to localhost.
# docker-compose.dev.yml publishes the other services too; docker-compose.prod.yml hardens them:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
name: credit-risk

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-local}
        MODEL_VERSION: ${MODEL_VERSION:-local}
    image: credit-risk-api:${IMAGE_TAG:-local}
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env (16+ characters)}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_VERSION: ${MODEL_VERSION:-local}
      # Pseudonymised prediction log for the drift monitor (retention enforced by the API).
      PREDICTION_LOG_PATH: /app/state/predictions.db
      PREDICTION_LOG_SALT: ${PREDICTION_LOG_SALT:-local-development-salt}
      PREDICTION_LOG_RETENTION_DAYS: ${PREDICTION_LOG_RETENTION_DAYS:-30}
      # Model from the mounted files below. To load from the registry instead, set MODEL_URI
      # (needs an image with mlflow, plus MLFLOW_TRACKING_* in the environment).
    volumes:
      - ./models:/app/models:ro
      - prediction-log:/app/state
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks: [backend, frontend]

  frontend:
    build:
      context: ./frontend
    image: credit-risk-frontend:${IMAGE_TAG:-local}
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:?set API_KEY in .env (16+ characters)}
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    networks: [frontend]

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [backend]

  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.mlflow
    image: credit-risk-mlflow:${IMAGE_TAG:-local}
    environment:
      # Driver named explicitly: SQLAlchemy 2.1 would otherwise pick psycopg (v3), which is not installed.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlflow}
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    image: credit-risk-monitor:${IMAGE_TAG:-local}
    environment:
      PREDICTION_LOG_PATH: /app/state/predictions.db
      MONITOR_HOST: 0.0.0.0 # reachable on the backend network only (no published port)
      MONITOR_WINDOW_HOURS: ${MONITOR_WINDOW_HOURS:-24}
      MONITOR_MIN_ROWS: ${MONITOR_MIN_ROWS:-200}
      MONITOR_INTERVAL_S: ${MONITOR_INTERVAL_S:-15}
    volumes:
      - prediction-log:/app/state
      - ./data/reference:/app/data/reference:ro # dvc repro creates it (src.models.drift)
      - ./reports/feature_schema.json:/app/reports/feature_schema.json:ro
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped
    networks: [backend]

  # Local webhook receiver that records every notification (the evidence for "alert fired and resolved").
  alert-sink:
    image: python:3.11-slim-bookworm
    command: ["python", "/app/alert_sink.py"]
    environment:
      ALERT_SINK_HOST: 0.0.0.0
      ALERT_LOG: /tmp/alerts.log # notifications are printed too: `docker compose logs alert-sink`
      PYTHONUNBUFFERED: "1"
    user: "10001:10001"
    volumes:
      - ./monitoring/alert_sink.py:/app/alert_sink.py:ro
    restart: unless-stopped
    networks: [backend]

  grafana:
    image: grafana/grafana-oss:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    networks: [backend, frontend]

networks:
  backend: {}
  frontend: {}

volumes:
  postgres-data: {}
  mlflow-artifacts: {}
  prometheus-data: {}
  grafana-data: {}
  prediction-log: {}
  alertmanager-data: {}
