# Prometheus for the Compose stack: scrapes the API and the drift monitor, evaluates the alert rules and sends
# firing alerts to Alertmanager. (The Kubernetes equivalent is k8s/monitoring/prometheus.yaml.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: credit-risk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: scoring-api
  - job_name: drift-monitor
    metrics_path: /metrics
    static_configs:
      - targets: ["monitor:9101"]
        labels:
          service: drift-monitor
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
