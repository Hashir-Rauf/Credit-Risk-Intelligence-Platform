# Prometheus scrape configuration (Phase 8 adds alert rules and dashboards).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: credit-risk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: scoring-api
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
