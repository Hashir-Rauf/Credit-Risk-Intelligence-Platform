# gitleaks configuration. Extends the default rules; adds ONE narrow, documented exception.
# Picked up automatically by the pre-commit hook and by gitleaks-action (repo root).
title = "credit-risk gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Kubeflow compiled pipeline: `secretKey:` is the NAME of an entry inside a Kubernetes Secret (credit-risk-phase5), not a secret value"
condition = "AND"
regexTarget = "line"
targetRules = ["generic-api-key"]
paths = ['''^pipelines/kubeflow/compiled_pipeline\.yaml$''']
regexes = ['''secretKey:\s*PHASE5_[A-Z0-9_]+''']
