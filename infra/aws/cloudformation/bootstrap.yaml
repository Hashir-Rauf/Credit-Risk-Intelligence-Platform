AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Credit Risk API - long-lived foundation: ECR repository, artifact bucket, log group, API-key secret and the
  alert topic. The ECS service, roles and alarms live in service.yaml.

Parameters:
  AlertEmail:
    Type: String
    Description: Address that receives CloudWatch alarm notifications (it must confirm the SNS subscription).
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [7, 14, 30]
  CreateBudget:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      The project already has a budget (created in the Billing console, 2026-11-08). Set true to create this
      template's own budget as well.
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
    Description: Monthly cost budget in USD (only used when CreateBudget is true).

Conditions:
  MakeBudget: !Equals [!Ref CreateBudget, "true"]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: credit-risk-api
      ImageTagMutability: IMMUTABLE # a git SHA tag can never be re-pointed
      EmptyOnDelete: true # lets teardown delete the repository together with its images
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the 20 most recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: credit-risk-frontend
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"keep the 10 most recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-prediction-logs
            Status: Enabled
            Prefix: prediction-logs/
            ExpirationInDays: 30
          - Id: expire-monitoring-reports
            Status: Enabled
            Prefix: monitoring-reports/
            ExpirationInDays: 90

  ArtifactBucketTls:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/credit-risk-api
      RetentionInDays: !Ref LogRetentionDays

  ApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: credit-risk-api/api-key
      Description: X-API-Key accepted by the scoring API. Generated by AWS; it never appears in the repository.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  PredictionLogSaltSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: credit-risk-api/prediction-log-salt
      Description: Key for the one-way customer pseudonyms in the prediction log. Generated by AWS.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: credit-risk-api-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # rules.md section 8: the budget alert exists before anything billable is deployed.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: MakeBudget
    Properties:
      Budget:
        BudgetName: credit-risk-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: credit-risk-bootstrap-RepositoryUri
  RepositoryArn:
    Value: !GetAtt Repository.Arn
    Export:
      Name: credit-risk-bootstrap-RepositoryArn
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
    Export:
      Name: credit-risk-bootstrap-FrontendRepositoryUri
  FrontendRepositoryArn:
    Value: !GetAtt FrontendRepository.Arn
    Export:
      Name: credit-risk-bootstrap-FrontendRepositoryArn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: credit-risk-bootstrap-ArtifactBucket
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: credit-risk-bootstrap-ArtifactBucketArn
  LogGroupName:
    Value: !Ref LogGroup
    Export:
      Name: credit-risk-bootstrap-LogGroup
  LogGroupArn:
    Value: !GetAtt LogGroup.Arn
    Export:
      Name: credit-risk-bootstrap-LogGroupArn
  ApiKeySecretArn:
    Value: !Ref ApiKeySecret
    Export:
      Name: credit-risk-bootstrap-ApiKeySecretArn
  PredictionLogSaltSecretArn:
    Value: !Ref PredictionLogSaltSecret
    Export:
      Name: credit-risk-bootstrap-PredictionLogSaltSecretArn
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export:
      Name: credit-risk-bootstrap-AlertTopicArn
