name: Phase 5 orchestration tests
on:
  pull_request:
    paths:
      - "pipelines/**"
      - "src/**"
      - "scripts/phase5*"
      - "params.yaml"
      - "requirements.lock.txt"
      - ".github/workflows/phase5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        environment: [ml, kfp, airflow]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - if: matrix.environment == 'kfp'
        run: |
          python -m pip install -r pipelines/kubeflow/requirements.txt pytest==9.2.0
          python -m pytest pipelines/tests/test_graph.py
      - if: matrix.environment == 'airflow'
        run: |
          python -m pip install 'apache-airflow==2.10.5' --constraint 'https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt'
          python -m pip install pytest==9.2.0
          python -m pytest pipelines/tests/test_dag.py
      - if: matrix.environment == 'ml'
        env:
          DVC_NO_ANALYTICS: "true"
          PHASE5_MODEL_INSTALLER: /tmp/install-credit-model
          OMP_NUM_THREADS: "2"
          LOKY_MAX_CPU_COUNT: "2"
        run: |
          python -m pip install -r requirements.lock.txt pytest==9.2.0
          cc -static -Os -s pipelines/docker/install-model.c -o "$PHASE5_MODEL_INSTALLER"
          python -m pytest pipelines/tests/test_snapshot.py
          python scripts/phase5-local-smoke.py
