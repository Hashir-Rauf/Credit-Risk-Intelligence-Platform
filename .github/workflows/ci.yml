# CI: every push and pull request is linted, tested, scanned and (once a Dockerfile exists)
# built. The single job "CI passed" is the one to mark as a REQUIRED status check on `main`
# (GitHub: Settings > Branches/Rules > Require status checks > "CI passed").
#
# Third-party actions are pinned to commit SHAs (supply-chain safety); the tag is in the comment.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11" # matches requirements.lock.txt (compiled for py3.11, linux)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff, black)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install lint tools
        run: pip install "$(grep '^ruff==' requirements-ci.txt)" "$(grep '^black==' requirements-ci.txt)"
      - run: ruff check .
      - run: black --check .

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-ci.txt
      - name: Install locked dependencies
        run: pip install -r requirements.lock.txt -r requirements-ci.txt
      - name: Run tests in parallel, one worker per test module (fails under the coverage minimum in pyproject.toml)
        run: >
          pytest -p no:cacheprovider -n auto --dist loadfile --cov --cov-report=term-missing
          --cov-report=xml --junitxml=junit.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          retention-days: 14

  security:
    name: Security (bandit, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install scanners
        run: pip install "$(grep '^bandit==' requirements-ci.txt)" "$(grep '^pip-audit==' requirements-ci.txt)"
      - name: bandit (medium severity and above fails the build)
        run: bandit -r src -c pyproject.toml -ll
      - name: pip-audit (known vulnerabilities in locked dependencies)
        # Accepted risks are listed in docs/security.md with a reason; each needs an ID here.
        #   PYSEC-2026-2447: diskcache (via dvc-data), pickle cache read needs local write access.
        run: >
          pip-audit -r requirements.lock.txt --no-deps --disable-pip -s osv
          --ignore-vuln PYSEC-2026-2447

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build + Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -f docker/Dockerfile.api --target runtime -t credit-risk-api:ci .
      - name: Build the frontend image
        run: docker build -t credit-risk-frontend:ci frontend
      - name: Build the drift monitor image
        run: docker build -f docker/Dockerfile.monitor -t credit-risk-monitor:ci .
      - name: Smoke test the API container (no model inside, so it must say 503)
        run: |
          KEY="$(openssl rand -hex 16)"
          docker run -d --name api-smoke -p 8000:8000 -e API_KEY="$KEY" credit-risk-api:ci
          code=000
          for _ in $(seq 1 30); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:8000/health || true)"
            [ "$code" = "503" ] && break
            sleep 2
          done
          cat /tmp/health.json; echo
          test "$code" = "503"                                      # up, honest about having no model
          grep -q '"model_loaded":false' /tmp/health.json
          unauth="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8000/predict)"
          test "$unauth" = "401"                                    # auth is enforced
          test "$(docker exec api-smoke id -u)" = "10001"          # not root
          curl -s http://127.0.0.1:8000/metrics | grep -q '^api_requests_total'
          docker rm -f api-smoke
      - name: Trivy scan of the API image (HIGH and CRITICAL with a fix available fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan of the drift monitor image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-monitor:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan of the frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-risk-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  frontend:
    name: Frontend (lint, types, unit tests, build, browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install the browser for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (mock API; proves the API key never reaches the browser)
        run: npm run e2e
      - name: npm audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  ci-passed:
    name: CI passed
    # Single aggregate check: make THIS the required status check on main.
    if: always()
    needs: [lint, test, security, secrets, docker, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "A required job did not succeed ($r)"; exit 1; fi
          done
