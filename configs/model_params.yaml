# Model hyperparameter defaults. v0 placeholders: Cycle 2 (baseline) and Cycle 3 (Optuna
# search spaces) finalise these. Seeds come from params.yaml, never from here.
logistic_regression:
  C: 1.0
  max_iter: 1000
  class_weight: balanced

random_forest:
  n_estimators: 300
  max_depth: 12
  min_samples_leaf: 5
  class_weight: balanced_subsample
  n_jobs: -1

hist_gradient_boosting:
  max_iter: 300
  learning_rate: 0.05
  max_depth: 4
  class_weight: balanced
  early_stopping: false # the internal validation split of "auto" would hide data from the model

# Optuna search spaces (Cycle 3). Fixed hyperparameters above are used for anything not searched.
# type: float | int | categorical; log: true samples on a log scale.
search_spaces:
  logistic_regression:
    C: {type: float, low: 0.001, high: 100.0, log: true}
    class_weight: {type: categorical, choices: [balanced, null]}
  random_forest:
    n_estimators: {type: int, low: 100, high: 400, step: 50}
    max_depth: {type: int, low: 4, high: 20}
    min_samples_leaf: {type: int, low: 1, high: 30, log: true}
    max_features: {type: categorical, choices: [sqrt, 0.3, 0.5]}
  hist_gradient_boosting:
    learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
    max_iter: {type: int, low: 100, high: 500, step: 50}
    max_depth: {type: int, low: 2, high: 8}
    min_samples_leaf: {type: int, low: 10, high: 100, log: true}
    l2_regularization: {type: float, low: 0.001, high: 10.0, log: true}
