# Model hyperparameter defaults. v0 placeholders: Cycle 2 (baseline) and Cycle 3 (Optuna
# search spaces) finalise these. Seeds come from params.yaml, never from here.
logistic_regression:
  C: 1.0
  max_iter: 1000
  class_weight: balanced

random_forest:
  n_estimators: 300
  max_depth: 12
  min_samples_leaf: 5
  class_weight: balanced_subsample
  n_jobs: -1

# Boosted trees: library (xgboost | lightgbm) is chosen in Cycle 3 once both are compared.
boosted_trees:
  n_estimators: 400
  learning_rate: 0.05
  max_depth: 4
