# Production-style overrides: nothing but the API and frontend is reachable from outside, containers are
# read-only with no extra privileges, and resources are capped.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  api:
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 1.0
    environment:
      LOG_LEVEL: INFO
      RATE_LIMIT_PER_MINUTE: "600" # per client address; the frontend server counts as one client
  frontend:
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
  mlflow:
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 1g
  monitor:
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 768m
  alertmanager:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
  alert-sink:
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 128m
  prometheus:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
  grafana:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    ports: !reset []
